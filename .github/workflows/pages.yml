name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Validate public service URLs
        shell: bash
        env:
          VITE_NEON_AUTH_URL: ${{ vars.VITE_NEON_AUTH_URL }}
          VITE_NEON_DATA_API_URL: ${{ vars.VITE_NEON_DATA_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import { parseEnv } from 'node:util';
          const defaults = existsSync('.env.production')
            ? parseEnv(readFileSync('.env.production', 'utf8'))
            : {};
          for (const key of ['VITE_NEON_AUTH_URL', 'VITE_NEON_DATA_API_URL']) {
            const value = process.env[key]?.trim() || defaults[key]?.trim();
            if (!value) throw new Error(`Missing public configuration: ${key}. Production must connect to Neon.`);
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
              throw new Error(`${key} must be a public HTTPS service URL without credentials or query parameters.`);
            }
            appendFileSync(process.env.GITHUB_ENV, `${key}=${url.toString().replace(/\/$/, '')}\n`);
          }
          NODE
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
